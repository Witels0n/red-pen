version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Only propose releases that have been public for two weeks, which avoids
    # most compromised or quickly withdrawn versions.
    cooldown:
      default-days: 14
    groups:
      dev-dependencies:
        dependency-type: development
      dependencies:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
