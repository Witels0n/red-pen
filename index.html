<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Marker</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app">
      <section id="open-screen">
        <h1>PDF Marker</h1>
        <p id="privacy-note">
          Your PDF is not uploaded and not stored on any server. It never leaves this computer and
          is processed only in your browser.
        </p>
        <div id="drop-zone">
          <p>Drag a scanned test (PDF) here, or</p>
          <label class="button" for="file-input">Choose a PDF</label>
        </div>
        <p id="open-error" class="error" role="alert" hidden></p>
      </section>

      <section id="viewer-screen" hidden>
        <header id="toolbar">
          <label class="button" for="file-input">Open another PDF</label>
          <span id="file-name"></span>
          <span class="tool" id="tool-subtotal" data-tool="subtotal" data-ghost="Subtotal" role="button" tabindex="0" title="Drag onto the page">Subtotal</span>
          <span class="tool" id="tool-total" data-tool="total" data-ghost="Total" role="button" tabindex="0" title="Drag onto the page">Total</span>
          <span class="tool" id="tool-text" data-tool="text" data-ghost="Text note" role="button" tabindex="0" title="Drag onto the page">Text note</span>
          <span class="spacer"></span>
          <button type="button" id="zoom-out" aria-label="Zoom out">&minus;</button>
          <span id="zoom-level">100%</span>
          <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
          <button type="button" id="zoom-fit">Fit width</button>
          <button type="button" id="export">Export marked PDF</button>
        </header>
        <p id="viewer-error" class="error" role="alert" hidden></p>
        <div id="viewer"></div>
      </section>

      <input id="file-input" type="file" accept="application/pdf,.pdf" hidden />
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
